<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Pedidos del Día</title>
    <link rel="stylesheet" href="css/pedidos.css" />

    <!-- Google tag (gtag.js) -->
    <script
      async
      src="https://www.googletagmanager.com/gtag/js?id=G-299MWDD9Y5"
    ></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag() {
        dataLayer.push(arguments);
      }
      gtag("js", new Date());
      gtag("config", "G-299MWDD9Y5");
    </script>
  </head>
  <body>
    <main>
      <h1>Mis pedidos</h1>
      <p class="aviso" id="aviso" role="status"></p>
      <p class="vacio" id="loading">Cargando...</p>

      <!-- LOGIN -->
      <section class="card" id="auth" hidden>
        <form id="formLogin">
          <label for="email">Correo</label>
          <input
            id="email"
            name="email"
            type="email"
            autocomplete="email"
            required
          />
          <label for="password" style="margin-top: 10px">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            autocomplete="current-password"
            required
          />
          <button class="primary" type="submit">Iniciar sesión</button>
          <button
            class="sec"
            type="button"
            id="btnRegistrar"
            style="width: 100%; margin-top: 8px"
          >
            Registrarme
          </button>
        </form>
        <p class="vacio" style="margin-top: 12px">
          Escribe a <strong>pickerup05@gmail.com</strong> si deseas seguir
          usando la app.
        </p>
      </section>

      <!-- APP -->
      <div id="app" hidden>
        <p class="usuario" id="usuario"></p>

        <section class="card">
          <form id="formPedido">
            <div class="row">
              <div>
                <label for="fecha">Fecha</label
                ><input id="fecha" name="fecha" type="date" required />
              </div>
              <div>
                <label for="skus">SKUs</label
                ><input
                  id="skus"
                  name="skus"
                  type="number"
                  inputmode="numeric"
                  min="1"
                  placeholder="0"
                  required
                />
              </div>
            </div>
            <button class="primary" id="agregar" type="submit">
              Agregar pedido
            </button>
          </form>
        </section>

        <section class="card">
          <div class="row">
            <div>
              <label for="mes">Mes</label
              ><input id="mes" name="mes" type="month" />
            </div>
            <div>
              <label for="porcentaje">Descuento (%)</label
              ><input
                id="porcentaje"
                name="porcentaje"
                type="number"
                inputmode="decimal"
                min="0"
                max="100"
                step="0.01"
                placeholder="Ej: 18.5"
              />
            </div>
          </div>
          <div class="resumen">
            <div><span>Total bruto</span><b id="tB">$0</b></div>
            <div><span>Descuento</span><b class="out" id="tD">$0</b></div>
            <div><span>Total neto</span><b class="in" id="tN">$0</b></div>
          </div>
          <p class="cant">Pedidos del mes: <strong id="cant">0</strong></p>
        </section>

        <div id="dias"></div>

        <div class="pie">
          <button type="button" class="sec" id="borrarMes">Borrar mes</button>
          <button type="button" class="sec" id="btnLogout">
            Cerrar sesión
          </button>
        </div>
      </div>
    </main>

    <script type="module" src="js/app.js"></script>
  </body>
</html>
